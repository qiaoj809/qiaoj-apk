name: Build Android APK with Buildozer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create required requirements.txt
        run: |
          echo "buildozer==1.5.0" > requirements.txt
          echo "python-for-android==2024.1.21" >> requirements.txt
          cat requirements.txt

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-dev \
            libssl-dev \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev \
            pkg-config \
            libc6-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Configure Buildozer (optional)
        run: |
          if [ ! -f "buildozer.spec" ]; then
            echo "No buildozer.spec found, will use default config."
          fi

      - name: Build Android APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Build-Output
          path: bin/*.apk
          retention-days: 30
