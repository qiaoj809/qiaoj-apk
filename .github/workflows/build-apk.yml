# 工作流名称，在 GitHub Actions 面板中可见
name: Build Android APK with Buildozer

# 构建触发条件：手动触发、推送到 main 分支、PR 到 main 分支
on:
  workflow_dispatch:  # 手动触发（优先推荐，方便测试排错）
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 核心构建任务
jobs:
  build-apk:
    # 运行环境：选择 Ubuntu 最新版（兼容 Buildozer 构建 APK）
    runs-on: ubuntu-latest

    # 步骤执行顺序（已修复所有已知报错，关键步骤不可随意调换）
    steps:
      # 步骤 1：拉取完整项目代码（必须第一步，获取项目所有文件）
      - name: Checkout full repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整提交历史，避免文件缺失

      # 步骤 2：创建正确的 requirements.txt（核心修复：使用存在的稳定版本）
      - name: Create required requirements.txt
        run: |
          echo "buildozer==1.5.0" > requirements.txt
          # 替换为 PyPI 上存在的稳定版，解决安装失败问题
          echo "python-for-android==2024.1.21" >> requirements.txt
          cat requirements.txt  # 打印文件内容，验证创建成功

      # 步骤 3：设置 Python 3.9 环境（此时已有合法 requirements.txt，无报错）
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'  # 缓存 pip 依赖，加速后续构建

      # 步骤 4：安装 Python 依赖（可正常拉取包，无版本不存在报错）
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤 5：安装 Buildozer 所需系统依赖（Ubuntu 环境必备，不可缺少）
      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-dev \
            libssl-dev \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev \
            pkg-config \
            libc6-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5

      # 步骤 6：检查 Buildozer 配置文件（可选，已有 buildozer.spec 则自动识别）
      - name: Configure Buildozer (optional)
        run: |
          if [ ! -f "buildozer.spec" ]; then
            echo "No buildozer.spec found, will use default config."
          fi

      # 步骤 7：使用 Buildozer 构建 Android Debug 版 APK
      - name: Build Android APK with Buildozer
        run: |
          buildozer android debug

      # 步骤 8：上传 APK 产物（方便下载测试，保留 30 天）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Build-Output
          path: |
            bin/*.apk  # 匹配所有 Buildozer 生成的 APK 文件
          retention-days: 30  # 产物保留天数，可按需修改
