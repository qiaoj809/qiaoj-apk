# 工作流名称，可自定义
name: Build Kivy Android APK Automatically

# 触发条件：推送代码或手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发

# 定义打包任务
jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      # 步骤1：拉取项目代码
      - name: Checkout project code
        uses: actions/checkout@v4

      # 步骤2：配置 Python 环境
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 步骤3：安装 Buildozer 和系统依赖
      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      # 步骤4：执行打包
      - name: Build APK
        run: |
          buildozer android clean
          buildozer android debug --log-level=2

      # 步骤5：上传 APK 文件
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-APK-Output
          path: bin/*.apk
